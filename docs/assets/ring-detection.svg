<title id="t">How DhanChakra surfaces a circular-trading loop</title>
<desc id="d">Animated illustration: a scan sweeps a transaction graph, a four-company invoice loop is traced, a shared director is linked, and a flagged-for-review card appears with its evidence. Illustrative, not real data.</desc>
<style>
