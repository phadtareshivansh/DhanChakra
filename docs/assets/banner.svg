<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">DhanChakra</title>
  <desc id="d">Animated banner: a circular invoice loop with flowing arrows. DhanChakra, graph intelligence for shell-company and GST fraud detection.</desc>
  <style>
    .flow  { stroke-dasharray: 10 8; animation: flow 0.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    .node  { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .spin  { transform-box: fill-box; transform-origin: center; animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .twinkle { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    .under { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(26px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071F3A"/><stop offset="0.55" stop-color="#0C437C"/><stop offset="1" stop-color="#14609F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B35A"/><stop offset="1" stop-color="#E29839"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="reveal"><rect x="72" y="198" width="0" height="40">
      <animate attributeName="width" from="0" to="620" dur="1.8s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0.7 0.2 1"/>
    </rect></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>
  <rect class="drift" x="-200" y="0" width="260" height="320" fill="url(#sheen)"/>

  <g transform="translate(930 20)">
    <!-- the chakra: a slowly turning ring behind the loop -->
    <circle class="spin" cx="175" cy="160" r="150" fill="none" stroke="#E29839" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round"/>
    <circle class="spin" style="animation-direction:reverse;animation-duration:70s" cx="175" cy="160" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="1 9" stroke-linecap="round"/>

    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" fill="none">
      <path d="M170 150L290 70"/><path d="M170 150L60 250"/><path d="M110 70L30 140"/>
      <path d="M290 220L350 170"/><path d="M230 40L270 -5"/>
    </g>
    <!-- invoices flowing around the loop -->
    <g fill="none" stroke="#E29839" stroke-width="3" stroke-linecap="round">
      <path class="flow" d="M122 78C152 56 198 56 228 78"/>
      <path class="flow" d="M250 106C270 138 270 182 250 214"/>
      <path class="flow" d="M228 242C198 264 152 264 122 242"/>
      <path class="flow" d="M100 214C80 182 80 138 100 106"/>
    </g>
    <g fill="#E29839">
      <polygon points="226,70 214,72 220,82"/><polygon points="258,208 252,220 262,218"/>
      <polygon points="124,250 136,248 130,238"/><polygon points="92,112 98,100 88,102"/>
    </g>
    <g fill="#0C437C" stroke="#E29839" stroke-width="3">
      <circle class="node" cx="110" cy="90" r="18" style="animation-delay:0s"/>
      <circle class="node" cx="240" cy="90" r="18" style="animation-delay:.8s"/>
      <circle class="node" cx="240" cy="230" r="18" style="animation-delay:1.6s"/>
      <circle class="node" cx="110" cy="230" r="18" style="animation-delay:2.4s"/>
    </g>
    <g fill="#ffffff">
      <circle class="twinkle" cx="170" cy="150" r="8" style="animation-delay:.2s"/>
      <circle class="twinkle" cx="290" cy="70" r="7" style="animation-delay:1.1s"/>
      <circle class="twinkle" cx="60" cy="250" r="7" style="animation-delay:2.1s"/>
      <circle class="twinkle" cx="30" cy="140" r="6" style="animation-delay:3s"/>
      <circle class="twinkle" cx="350" cy="170" r="6" style="animation-delay:1.6s"/>
      <circle class="twinkle" cx="270" cy="-5" r="5" style="animation-delay:2.6s"/>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="148" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Dhan<tspan fill="url(#gold)">C</tspan>hakra</text>
    <rect class="under" x="74" y="172" width="84" height="5" rx="2.5" fill="url(#gold)"/>
    <g clip-path="url(#reveal)">
      <text x="72" y="222" font-size="26" font-weight="500" fill="#DCE8F5">See the whole network. Prove the pattern.</text>
    </g>
    <text x="72" y="262" font-size="17" font-weight="500" fill="#9DB8D6" letter-spacing="0.4" opacity="0">Graph-AI for shell-company and GST input-tax-credit fraud detection
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
    </text>
  </g>
</svg>
