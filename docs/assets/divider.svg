<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 8" width="1280" height="8" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { transform: translateX(430px); } }
  </style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C437C" stop-opacity="0"/><stop offset="0.2" stop-color="#0C437C" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#0C437C" stop-opacity="0.5"/><stop offset="1" stop-color="#0C437C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E29839" stop-opacity="0"/><stop offset="0.5" stop-color="#F2B35A"/><stop offset="1" stop-color="#E29839" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1280" height="2" rx="1" fill="url(#base)"/>
  <rect class="sweep" x="0" y="2" width="420" height="4" rx="2" fill="url(#spark)"/>
</svg>
