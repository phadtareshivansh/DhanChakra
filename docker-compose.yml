services:
  neo4j:
    image: neo4j:5.23-community
    container_name: dhanchakra-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_dbms_memory_heap_max__size=${NEO4J_HEAP_MAX:-1G}
      - NEO4J_dbms_memory_pagecache_size=${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - ./graph/cypher:/cypher
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - dhanchakra-net

  postgres:
    image: postgres:16-alpine
    container_name: dhanchakra-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dhanchakra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dhanchakra}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhanchakra} -d ${POSTGRES_DB:-dhanchakra}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dhanchakra-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dhanchakra-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Container-internal service discovery (overrides the host-oriented
      # values in .env; all secrets/weights come from env_file above)
      - NEO4J_URI=bolt://neo4j:7687
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PYTHONPATH=/app
    volumes:
      - ./api/app:/app/app:ro
      - ./api/models:/app/models
      # Sample data is read-only and only used by the privacy guard tests
      # (api/tests/test_privacy_samples.py), which scan it for real PAN/Aadhaar
      # shapes. Mounted so the suite can see it from inside the container.
      - ./ingestion:/ingestion:ro
      # Operator scripts (e.g. break-glass Super Admin recovery) are read-only
      # in the container so they can be run with the API's env + deps:
      #   docker compose exec api python /scripts/reset_super_admin.py
      - ./scripts:/scripts:ro
      # Model benchmark harness (read-only) plus a writable docs mount so the
      # harness can refresh only the marker-bounded region of docs/benchmarks.md:
      #   docker compose exec api python /benchmarks/run_benchmark.py
      - ./api/benchmarks:/benchmarks:ro
      - ./docs:/docs
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dhanchakra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhanchakra-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET:-http://api:8000}
      - VITE_PORT=${VITE_PORT:-5173}
      - VITE_RISK_CRITICAL_THRESHOLD=${VITE_RISK_CRITICAL_THRESHOLD:-85}
      - VITE_RISK_HIGH_THRESHOLD=${VITE_RISK_HIGH_THRESHOLD:-65}
      - VITE_RISK_MEDIUM_THRESHOLD=${VITE_RISK_MEDIUM_THRESHOLD:-40}
      - VITE_DEMO_HINT=${VITE_DEMO_HINT}
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      - api
    networks:
      - dhanchakra-net

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  postgres-data:

networks:
  dhanchakra-net:
    driver: bridge